<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LifeSkills Homestead | Coming Soon</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#0B140E;
    --bg-deep:#060B08;
    --bg-card:#132018;
    --purple:#2B1B40;
    --purple-light:#4A2F6B;
    --gold:#C9A227;
    --gold-soft:#E0C165;
    --loblolly:#4F7A5C;
    --sage:#8FAF95;
    --text:#F2F5EF;
    --text-muted:#A7BBAA;
    --border:rgba(143,175,149,0.15);

    --font-display:'Fraunces', serif;
    --font-body:'DM Sans', sans-serif;
  }

  *{box-sizing:border-box;margin:0;padding:0;}

  body{
    font-family:var(--font-body);
    background:
      radial-gradient(ellipse 80% 55% at 50% 20%, rgba(79,122,92,0.22), transparent 60%),
      radial-gradient(ellipse 60% 40% at 85% 90%, rgba(74,47,107,0.25), transparent 60%),
      var(--bg);
    color:var(--text);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:2rem 1.5rem;
  }

  a{color:inherit;}

  .wrap{
    max-width:560px;
    text-align:center;
  }

  .icon-badge{
    width:76px;
    height:76px;
    margin:0 auto 1.75rem;
    border-radius:20px;
    background:rgba(201,162,39,0.12);
    border:1px solid rgba(201,162,39,0.3);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .icon-badge svg{
    width:32px;
    height:32px;
    stroke:var(--gold-soft);
  }

  .badge{
    display:inline-block;
    font-size:0.72rem;
    font-weight:700;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--purple-light-text, #C7B3E8);
    background:rgba(74,47,107,0.3);
    border:1px solid var(--purple-light);
    padding:0.4rem 1rem;
    border-radius:999px;
    margin-bottom:1.75rem;
  }

  h1{
    font-family:var(--font-display);
    font-weight:600;
    font-size:clamp(2.1rem, 6vw, 2.9rem);
    margin-bottom:1.1rem;
  }

  h1 em{
    font-style:italic;
    color:var(--gold);
  }

  p.desc{
    color:var(--text-muted);
    max-width:440px;
    margin:0 auto 2.25rem;
    font-size:1.02rem;
  }

  .home-btn{
    display:inline-flex;
    align-items:center;
    gap:0.55rem;
    background:transparent;
    border:1px solid var(--border);
    color:var(--text);
    font-weight:600;
    font-size:0.92rem;
    padding:0.8rem 1.5rem;
    border-radius:999px;
    text-decoration:none;
    transition:border-color 0.2s ease, color 0.2s ease;
  }

  .home-btn:hover{
    border-color:var(--gold);
    color:var(--gold-soft);
  }

  .home-btn svg{width:15px;height:15px;}
</style>
</head>
<body>

  <div class="wrap">
    <div class="icon-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 10 12 5 2 10l10 5 10-5Z"/>
        <path d="M6 12v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5"/>
      </svg>
    </div>

    <span class="badge">Coming Soon</span>

    <h1>LifeSkills <em>Homestead</em></h1>

    <p class="desc">Courses, workshops, and resources for building a self-reliant home life — from the kitchen garden to the workshop. Launching soon.</p>

    <a href="index.html" class="home-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      Back home
    </a>
  </div>

</body>
</html>
