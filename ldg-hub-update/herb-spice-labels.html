*{margin:0;padding:0;box-sizing:border-box}
body{background:#d9d5cc;font-family:'Jost',sans-serif;padding:40px 20px}
h1.pt{text-align:center;font-family:'Cormorant Garamond',serif;font-size:13px;font-weight:300;letter-spacing:5px;text-transform:uppercase;color:#3a3530;margin-bottom:6px}
p.sub{text-align:center;font-family:'Jost',sans-serif;font-size:8px;letter-spacing:3px;text-transform:uppercase;color:#6b6560;margin-bottom:36px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,480px);gap:32px;justify-content:center;max-width:1500px;margin:0 auto}
.label{width:480px;height:310px;background:#f0ece3;border:1.5px solid #2e2a24;display:grid;grid-template-columns:88px 1fr 128px}
.botanical{border-right:1.5px solid #2e2a24;display:flex;align-items:center;justify-content:center;padding:8px 5px;background:#e8e4db;overflow:hidden}
.botanical svg{width:76px;height:292px}
.botanical img{width:76px;height:292px;object-fit:cover;object-position:center}
.main{padding:14px 16px 11px 16px;display:flex;flex-direction:column;border-right:1.5px solid #2e2a24}
.herb-name{font-family:'Cormorant Garamond',serif;font-size:36px;font-weight:300;line-height:1;color:#2e2a24;margin-bottom:3px}
.fl{font-size:7.5px;font-weight:400;letter-spacing:2px;text-transform:uppercase;color:#2e2a24;border-bottom:1px solid #2e2a24;padding-bottom:7px;margin-bottom:9px}
.fl b{font-weight:500}
.sl{font-size:7px;font-weight:500;letter-spacing:2.5px;text-transform:uppercase;color:#2e2a24;margin-bottom:2px}
.cu{font-size:10px;font-weight:400;color:#2e2a24;line-height:1.5;text-transform:uppercase;letter-spacing:0.2px;margin-bottom:9px}
.pw{font-size:8px;font-weight:300;color:#2e2a24;line-height:1.5;margin-top:auto}
.pw em{font-style:normal;font-weight:500;letter-spacing:1px;text-transform:uppercase;font-size:7px}
.right{display:grid;grid-template-rows:76px 1fr 1fr}
.lc{border-bottom:1.5px solid #2e2a24;display:flex;align-items:center;justify-content:center;padding:7px}
.lc svg{width:80px;height:60px}
.hc{border-bottom:1.5px solid #2e2a24;padding:6px 8px}
.ic{padding:6px 8px}
.sbl{font-size:6.5px;font-weight:500;letter-spacing:2px;text-transform:uppercase;color:#2e2a24;margin-bottom:2px}
.sbt{font-size:7.8px;font-weight:300;color:#2e2a24;line-height:1.55}
@media print{body{background:#fff;padding:8px}.label{break-inside:avoid;page-break-inside:avoid}}
</style>
